source = $HOME/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

animations {
    enabled = true
}

$accent = $font_color
$font = JetBrainsMono Nerd Font ExtraBold

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/omarchy/current/background
  blur_passes = 3
  color = $accent
}

# TIME
label {
  monitor =
  text = $TIME12
  color = $accent
  font_size = 120
  font_family = CaskaydiaMono Nerd Font ExtraBold
  position = 0, -150
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $accent
  font_size = 25
  font_family = CaskaydiaMono Nerd Font ExtraBold
  position = 0, -420
  halign = center
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $inner_color
  font_color = $accent
  fade_on_empty = false
  placeholder_text = $USER
  hide_input = false
  check_color = $check_color
  fail_color = $outer_color
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $color
  position = 0, -800
  halign = center
  valign = top
}
