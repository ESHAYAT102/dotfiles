general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    hover_icon_on_border = false
}

decoration {
    rounding = 16
    rounding_power = 6.0

    blur {
        enabled = true
        size = 8
        passes = 2
        noise = 0.05
        new_optimizations = true
    }
}

gestures {
    gesture = 3, left, dispatcher, workspace, +1
    gesture = 3, right, dispatcher, workspace, -1
}

animations {
    enabled = yes
    bezier = snappy, 0.25, 0.46, 0.45, 0.94
    bezier = smooth, 0.23, 1, 0.32, 1
    bezier = slide, 0.165, 0.84, 0.44, 1
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, snappy, slide
    animation = windowsIn, 1, 4, overshot, popin 85%
    animation = windowsOut, 1, 3, snappy, popin 85%
    animation = windowsMove, 1, 4, snappy
    animation = fade, 1, 5, smooth
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = workspaces, 1, 3, smooth, slidefade 20%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = layersIn, 1, 3, smooth, popin 85%
    animation = layersOut, 1, 2, snappy, popin 85%
    animation = specialWorkspace, 1, 3, overshot, slidefade 15%
}

layerrule = blur on, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window

layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window


windowrule = match:title ^(Library|File Upload|Open File|Save File|Select a Folder|Open Folder|Upload(.*)|Save As|Select File|Select Folder|Choose File|Sign in - Google Accounts — Zen Browser|Task Manager - Brave).*$, float on, size 700 500, center on
windowrule = match:class xdg-desktop-portal-gtk, float on, size 800 600, center on

windowrule = match:title ^(walker).*$, float on, size 300 300, center on

windowrule = match:title ^(Waypaper).*$, float on, size 900 600, center on

windowrule = match:title ^(BLL-L22).*$, float on, center on, pin on

windowrule = size 400 500, match:class localsend

windowrule = match:title ^(Voice Recorder).*$, pin on, no_blur true, no_shadow true, border_size 0, opacity 1 1

layerrule = blur on, match:namespace ^(vicinae)$
layerrule = ignore_alpha 0.5, match:namespace ^(vicinae)$

exec-once = fcitx5 -d --disable classicui
