$terminal = uwsm app -- $TERMINAL

unbind = SUPER, SPACE
bindd = SUPER, SPACE, App list, exec, $HOME/.local/bin/desktop-shell-action apps
unbind = SUPER, period
bindd = SUPER, period, Emoji picker, exec, vicinae vicinae://launch/core/search-emojis
unbind = SUPER SHIFT, SPACE
bindd = SUPER SHIFT, SPACE, Toggle taskbar, exec, $HOME/.local/bin/desktop-shell-action taskbar
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Background switcher, exec, $HOME/.local/bin/desktop-shell-action wallpaper

unbind = SUPER, K
bindd = SUPER, K, Show key bindings, exec, $HOME/.local/bin/omarchy-menu-keybindings
unbind = SHIFT, Print
bindd = SHIFT, Print, Region screenshot, exec, $HOME/.local/bin/area-screenshot
unbind = SUPER, ESCAPE
bindd = SUPER, ESCAPE, Power menu, exec, $HOME/.local/bin/desktop-shell-action power
unbind = , XF86PowerOff
bindld = , XF86PowerOff, Power menu, exec, $HOME/.local/bin/desktop-shell-action power

unbind = SUPER, A
bindd = SUPER, A, Notification Center, exec, $HOME/.local/bin/desktop-shell-action notifications
unbind = SUPER, Z
bindd = SUPER, Z, Dashboard, exec, $HOME/.local/bin/desktop-shell-action dashboard
unbind = SUPER ALT, Z
bindd = SUPER ALT, Z, Toggle scratchpad, togglespecialworkspace, scratchpad
unbind = SUPER, comma
bindd = SUPER, comma, Clear all notifications, exec, $HOME/.local/bin/desktop-shell-action clear-notifications
unbind = SUPER CTRL, comma
bindd = SUPER CTRL, comma, Toggle Do Not Disturb, exec, $HOME/.local/bin/desktop-shell-action dnd
unbind = SUPER CTRL ALT SHIFT, Z
bindd = SUPER CTRL ALT SHIFT, Z, Toggle desktop shell, exec, $HOME/.local/bin/desktop-shell-toggle toggle
unbind = SUPER CTRL, W
bindd = SUPER CTRL, W, Open WiFi, exec, $HOME/.local/bin/desktop-shell-action wifi
unbind = SUPER CTRL, B
bindd = SUPER CTRL, B, Open Bluetooth, exec, $HOME/.local/bin/desktop-shell-action bluetooth
unbind = SUPER CTRL, A
unbind = SUPER CTRL SHIFT, A
bindd = SUPER CTRL SHIFT, A, Open Audio, exec, $HOME/.local/bin/desktop-shell-action audio
unbind = SUPER CTRL, M
bindd = SUPER CTRL, M, Open Monitor config, exec, $HOME/.local/bin/desktop-shell-action monitor
unbind = SUPER ALT, W
unbind = SUPER, V
bindd = SUPER, V, Clipboard, exec, $HOME/.local/bin/desktop-shell-action clipboard
unbind = SUPER, L
bindd = SUPER, L, Lock screen, exec, $HOME/.local/bin/desktop-shell-action lock
bindd = SUPER SHIFT, L, Screensaver, exec, omarchy-launch-screensaver
bindd = SUPER, return, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, return, Alternative Terminal, exec, terax
bindd = SUPER, E, Yazi, exec, $terminal -e yazi
bindd = SUPER SHIFT, E, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, W, Browser, exec, zen-browser
bindd = SUPER SHIFT, W, Private Browser, exec, zen-browser --private-window
bindd = SUPER, R, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, R, Mission Center, exec, flatpak run io.missioncenter.MissionCenter
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, P, SCRCPY, exec, adb connect 192.168.68.103:5555 && scrcpy --serial=192.168.68.103:5555 --turn-screen-off --stay-awake --power-off-on-close
bindd = SUPER SHIFT, P, SCRCPY, exec, adb connect 192.168.68.103:5555 && scrcpy --serial=192.168.68.103:5555 --stay-awake --power-off-on-close
bindd = SUPER, C, Code Editor, exec, zeditor
bindd = SUPER, T, T3 Code, exec, t3code-nightly
bindd = SUPER, D, Discord, exec, flatpak run com.discordapp.Discord
bindd = SUPER, S, Music, exec, spotify
bindd = SUPER, M, kew, exec, $terminal -e kew
bindd = SUPER SHIFT, M, Cliamp, exec, $terminal -e cliamp
bindd = SUPER, G, Gapless, exec, flatpak run com.github.neithern.g4music
bindd = SUPER ALT, S, Share, exec, localsend
unbind = SUPER, I
bindd = SUPER, I, Settings, exec, $HOME/.local/bin/desktop-shell-action settings
bindd = SUPER, H, Hermes, exec, hermes desktop
bindd = SUPER ALT, SPACE, Confetti, exec, vicinae vicinae://launch/@esh/confetti/confetti
bindd = SUPER, X, Dictation, exec, voxtype record toggle

bindle = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh vol-up
bindle = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh vol-down
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/osd.sh vol-mute
bindl = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/osd.sh mic-mute
bindle = ALT, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh vol-up 1
bindle = ALT, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh vol-down 1
bindle = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh bright-up
bindle = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh bright-down
bindle = ALT, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh bright-up 1
bindle = ALT, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh bright-down 1
bindle = SUPER, page_up, exec, ~/.config/hypr/scripts/osd.sh bright-up
bindle = SUPER, page_down, exec, ~/.config/hypr/scripts/osd.sh bright-down
bindle = SUPER ALT, page_up, exec, ~/.config/hypr/scripts/osd.sh bright-up 1
bindle = SUPER ALT, page_down, exec, ~/.config/hypr/scripts/osd.sh bright-down 1
bindle = SHIFT, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh bright-max
bindle = SHIFT, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh bright-min

bindd = SUPER ALT, T, Show time, exec, ~/.config/hypr/scripts/osd.sh time
bindd = SUPER ALT, B, Open Battery, exec, $HOME/.local/bin/desktop-shell-action battery
bindd = SUPER CTRL, D, Open Taildrop, exec, env OMARCHY_PATH=$HOME/.config/omarchy/quattro-bar-only omarchy-shell shell toggle taildrop
bindd = SUPER, code:49, Workspace overview, exec, env OMARCHY_PATH=$HOME/.config/omarchy/quattro-bar-only omarchy-shell shell toggle omarchy-overview

bind = ALT, left, sendshortcut, , Home, activewindow
bind = ALT, right, sendshortcut, , End, activewindow
bind = ALT SHIFT, left, sendshortcut, SHIFT, Home, activewindow
bind = ALT SHIFT, right, sendshortcut, SHIFT, End, activewindow
bind = ALT, Backspace, sendshortcut, SHIFT, Home, activewindow
bind = ALT, Backspace, sendshortcut, , Delete, activewindow
bind = ALT, Delete, sendshortcut, SHIFT, End, activewindow
bind = ALT, Delete, sendshortcut, , Delete, activewindow
