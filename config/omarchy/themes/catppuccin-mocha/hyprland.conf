source = $HOME/.config/omarchy/current/theme/mocha.conf

layerrule = blur on, match:namespace waybar

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(cba6f766)
    col.inactive_border = rgba(11111b00)
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    hover_icon_on_border = false
}

group {
    col.border_active = $mauve
    groupbar {
        col.inactive = $base
        col.active = $surface0
    }
}

animations {
    enabled = yes
    bezier = snappy, 0.25, 0.46, 0.45, 0.94
    bezier = smooth, 0.23, 1, 0.32, 1
    bezier = slide, 0.165, 0.84, 0.44, 1
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, snappy, slide
    animation = windowsIn, 1, 4, overshot, popin 85%
    animation = windowsOut, 1, 3, snappy, popin 85%
    animation = windowsMove, 1, 4, snappy
    animation = fade, 1, 5, smooth
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = workspaces, 1, 3, smooth, slidefade 20%
    animation = border, 1, 5, default
    animation = borderangle, 1, 8, default
    animation = layersIn, 1, 3, smooth, popin 85%
    animation = layersOut, 1, 2, snappy, popin 85%
    animation = specialWorkspace, 1, 3, overshot, slidefade 15%
}

decoration {
    rounding = 16
    rounding_power = 6.0
    active_opacity = 0.9
    inactive_opacity = 0.7

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        noise = 0.05
        new_optimizations = true
    }
}

misc {
   background_color = $base
}

layerrule {
    name = blur_with_ignore_alpha
    match:namespace = ^(walker|notifications|swayosd|waybar/swaync)$
    blur = true
    ignore_alpha = 0.1
}
