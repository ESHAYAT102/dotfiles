[Settings]
language = en
folder = ~/.config/omarchy/current/theme/backgrounds
monitors = All
wallpaper = ~/.config/omarchy/current/theme/backgrounds/Dune-by-Mikk-Tonissoo.jpg
show_path_in_tooltip = True
backend = swaybg
fill = fill
sort = name
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = /home/eshayat/.config/waypaper/style.css
post_command = /bin/sh -c 'rm -rf /home/eshayat/.config/omarchy/current/background && ln -sf "$wallpaper" /home/eshayat/.config/omarchy/current/background'
